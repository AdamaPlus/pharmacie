name: pharmaguinee — Windows Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Activer le support Windows pour Flutter
        run: flutter config --enable-windows-desktop

      - name: Précacher les artefacts Windows
        run: flutter precache --windows

      - name: Vérifier l'environnement Flutter
        run: flutter doctor -v

      - name: Nettoyer le projet
        run: flutter clean

      - name: Installer les dépendances
        run: flutter pub get

      - name: Compiler pour Windows (Release)
        run: flutter build windows --release

      - name: Télécharger le composant Microsoft Visual C++ officiel
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "installer_assets" | Out-Null
          Invoke-WebRequest -Uri "https://aka.ms/vc14/vc_redist.x64.exe" -OutFile "installer_assets\vc_redist.x64.exe"

      - name: Installer Inno Setup
        run: choco install innosetup -y

      - name: Créer le dossier output_setup
        run: New-Item -ItemType Directory -Force -Path "output_setup"

      - name: Générer le fichier Setup.exe
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
            $paths = @(
              "C:\ProgramData\chocolatey\bin\iscc.exe",
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
            )
            $iscc = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if ($null -eq $iscc) {
            Write-Error "ISCC.exe introuvable après installation d'Inno Setup"
            exit 1
          }
          Write-Host "ISCC trouvé : $iscc"
          & $iscc "windows\pharmaguinee_installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publier l'installeur en artefact
        uses: actions/upload-artifact@v4
        with:
          name: pharmaguinee-windows-installer
          path: output_setup/*.exe
          retention-days: 30
