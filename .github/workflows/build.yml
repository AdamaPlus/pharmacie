name: pharmaguinee — Windows Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Activer le support Windows pour Flutter
        run: flutter config --enable-windows-desktop

      - name: Précacher les artefacts Windows
        run: flutter precache --windows

      - name: Vérifier l'environnement Flutter
        run: flutter doctor -v

      - name: Nettoyer le projet
        run: flutter clean

      - name: Installer les dépendances
        run: flutter pub get

      - name: Compiler pour Windows (Release)
        run: flutter build windows --release

      - name: Installer Inno Setup
        run: choco install innosetup -y

      - name: Générer le fichier Setup.exe
        shell: pwsh
        run: |
          $paths = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe",
            "C:\Program Files (x86)\Inno Setup 5\ISCC.exe"
          )
          $exe = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($null -eq $exe) {
            Write-Error "ISCC.exe introuvable après installation d'Inno Setup"
            exit 1
          }
          New-Item -ItemType Directory -Force -Path "output_setup" | Out-Null
          & $exe "windows\pharmaguinee_installer.iss"

      - name: Publier l'installeur en artefact
        uses: actions/upload-artifact@v4
        with:
          name: pharmaguinee-windows-installer
          path: output_setup/*.exe
          retention-days: 30
