name: pharmaguinee — Windows Build & Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Configurer Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Nettoyer le projet
        run: flutter clean

      - name: Installer les dépendances
        run: flutter pub get

      - name: Compiler pour Windows (Release)
        run: flutter build windows --release

      - name: Installer Inno Setup
        run: choco install innosetup -y

      - name: Générer le fichier Setup.exe
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer.iss"

      - name: Publier l'installeur en artefact
        uses: actions/upload-artifact@v4
        with:
          name: pharmaguinee-windows-installer
          path: Output/*.exe
          retention-days: 30
